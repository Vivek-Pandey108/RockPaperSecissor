<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock,Paper,Scissor Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="heading">
            <h1>Rock Paper Scissors</h1>
        </div>
        <div class="game">
            <div class="choice-container">
                <img id="rock" class="choice" src="rock.png" alt="">
                <img  id="paper" class="choice" src="paper.png" alt="">
                <img id="scissor" class="choice" src="scissors.png" alt="">
            </div>
            <div class="text-container">
                <div class="user">
                    <p id="user-score">0</p>
                    <p>You</p>
                </div>
                <div class="comp">
                    <p id="comp-score">0</p>
                    <p>Comp</p>
                </div>
            </div>
            <div class="result">
                <p id="msg">Pick Your Move</p>
            </div>
        </div>

    </div>

<script src="script.js"></script>
</body>
</html>
